<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Sayang ❤️</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.box{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:350px;
}

input{
    width:90%;
    padding:12px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

button{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>
<body>
<div class="box">
    <h1>Welcome Sayang ❤️</h1>
    <p>Masukkan nama kamu dulu yaa 😊</p>

    <input type="text" id="nama" placeholder="Nama kamu">

    <br>

    <button onclick="masuk()">Masuk</button>
</div>

<script>
function masuk(){
    let nama = document.getElementById('nama').value;

    if(nama == ''){
        alert('Isi nama dulu ya ❤️');
        return;
    }

    localStorage.setItem('namaPacar', nama);
    window.location.href = 'warna.html';
}
</script>

</body>
</html>
